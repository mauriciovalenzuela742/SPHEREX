title: AstroTRACK in 30 seconds
# Video de 30 s para la entrega (subtítulos en inglés) y para la lámina 4 del pitch. App real (rama
# c/pitch-alternativa) en local con vite.demo.config.ts; grabado con tools/demo_pitch.py (copia del grabador del kit con
# frame/frac/pad/move). Ejemplos revisados uno por uno antes de grabar:
# - Epsilon Indi B: A − B con par rojo/azul nítido; espectro con agua y metano; ficha «parece una enana marrón».
#   Fotos del precalculado del sitio (IRSA caído al grabar, 15-nov).
# - Barnard: en el mapa, la estrella dentro de cada aro (2MASS ~2000, AllWISE 2010, SPHEREx 2026).
url: "http://localhost:5191/?ra=331.098404&dec=-56.801258&size=0.1&band=4"
init_script: "localStorage.setItem('astrotrack.idioma','en');localStorage.setItem('astrotrack.tutorial.visto','1')"
viewport: [1600, 900]
output: figures/demo_pitch
label: "Real app · local copy · cached data"
lang: en
steps:
- caption: ''
  wait: 30000
  hold: 100
  zoom: false
- click: .simple-aviso button
  caption: 'Anyone can start: a SPHEREx photo of Epsilon Indi B, a nearby brown dwarf'
  zoom: false
  move: 600
  wait: 600
  hold: 1500
- click: .simple-fechas button:nth-child(2)
  frame: .simple-imagen
  frac:
  - 0
  - 0
  - 1
  - 1.13
  pad: 1.05
  move: 600
  caption: Spring 2025…
  wait: 400
  hold: 700
- click: .simple-ab button:nth-child(2)
  frame: .simple-centro
  pad: 1.0
  move: 450
  pre: 100
  caption: Spring 2025…
  wait: 250
  hold: 150
- click: .simple-fechas button:nth-child(5)
  frame: .simple-imagen
  frac:
  - 0
  - 0
  - 1
  - 1.13
  pad: 1.05
  move: 500
  caption: '…and October 2026: it shifted about one pixel'
  wait: 400
  hold: 1000
- click: .simple-ab button:nth-child(3)
  frame: .simple-centro
  pad: 1.0
  move: 450
  pre: 100
  caption: '…and October 2026: it shifted about one pixel'
  wait: 250
  hold: 150
- click: .simple-ab-ver
  frame: .simple-imagen
  pad: 1.05
  move: 500
  caption: 'A − B: red where it was, blue where it is now. It moved.'
  wait: 600
  hold: 2000
- click: .interruptor-ciencia
  caption: One switch opens the science tools
  zoom: false
  move: 600
  wait: 9000
  hold: 500
- zoom: .huella
  pad: 1.08
  caption: 'Its spectrum in 102 colors: dips where water and methane absorb'
  hold: 1800
- zoom: .ficha
  frame: .ficha
  frac:
  - 0
  - 0
  - 0.6
  - 1
  pad: 1.1
  caption: 'The tool''s reading: it looks like a brown dwarf'
  hold: 1600
- type:
    selector: .com-form input
    text: Ana
  scroll_full: true
  frame: .comentarios
  frac:
  - 0
  - 0
  - 0.5
  - 1
  pad: 1.08
  move: 500
  pre: 80
  caption: Leave a note for the next explorer
  hold: 80
- type:
    selector: .com-form textarea
    text: It moved!
  frame: .comentarios
  frac:
  - 0
  - 0
  - 0.5
  - 1
  pad: 1.08
  move: 350
  pre: 80
  caption: Leave a note for the next explorer
  hold: 80
- click: .com-form button[type=submit]
  frame: .comentarios
  frac:
  - 0
  - 0
  - 0.5
  - 1
  pad: 1.08
  move: 350
  pre: 80
  caption: 'Saved: the note stays on this object for the next explorer'
  wait: 600
  hold: 2000
- click: .objetos button:has-text('Barnard')
  caption: 'Every star has a history: Barnard''s Star'
  zoom: false
  move: 600
  wait: 6000
  hold: 400
- zoom: .dupla-mapa button:has-text('2MASS')
  frame: .aladin-container
  frac:
  - 0.25
  - 0.28
  - 0.5
  - 0.66
  pad: 1.05
  nobox: true
  caption: 'Circles: where it should be in each survey'
  hold: 800
- click: .dupla-mapa button:has-text('2MASS')
  frame: .aladin-container
  frac:
  - 0.25
  - 0.28
  - 0.5
  - 0.66
  pad: 1.05
  move: 400
  pre: 80
  wait: 8000
  caption: ~2000 (2MASS)
  hold: 1000
- click: .dupla-mapa button:has-text('AllWISE')
  frame: .aladin-container
  frac:
  - 0.25
  - 0.28
  - 0.5
  - 0.66
  pad: 1.05
  move: 400
  pre: 80
  wait: 8000
  caption: 2010 (WISE)
  hold: 1000
- click: .dupla-mapa button:has-text('SPHEREx 2025')
  frame: .aladin-container
  frac:
  - 0.25
  - 0.28
  - 0.5
  - 0.66
  pad: 1.05
  move: 400
  pre: 80
  wait: 6000
  caption: '2026 (SPHEREx): still moving. Real NASA data, free, in any browser'
  hold: 1500
