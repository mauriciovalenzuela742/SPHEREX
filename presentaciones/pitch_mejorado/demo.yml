title: AstroTRACK finds WISE 0855 moving, from the simple view to the science tools
# Grabado del producto real (main, PR #65) corrido en local con vite.demo.config.ts: las respuestas del servidor de
# fotos quedan en disco para que no haya esperas. Mismos datos que entrega el servidor de producción.
url: http://localhost:5191/?vista=visor
viewport: [1600, 900]
output: figures/demo_pitch
label: "Real app · local copy · cached data"
lang: en
steps:
  - click: ".simple-idioma button:nth-child(2)"
    caption: "Anyone can start: the sky, in SPHEREx photos"
    wait: 2500
    hold: 1200
    zoom: false
  - click: ".simple-chips button:has-text('WISE 0855')"
    caption: "Pick WISE 0855, the coldest brown dwarf known"
    wait: 3500
    hold: 1400
  - click: ".luz-lejana"
    caption: "Far infrared (3.8–5 µm): where cold objects glow"
    wait: 1200
    hold: 1300
  - click: ".simple-fechas button:nth-child(2)"
    caption: "May 2025…"
    wait: 900
    hold: 900
  - click: ".simple-fechas button:nth-child(4)"
    caption: "…one year later"
    wait: 900
    hold: 900
  - click: ".simple-fechas button:nth-child(2)"
    caption: "Blink the dates, like volunteers do"
    wait: 700
    hold: 700
  - click: ".simple-fechas button:nth-child(4)"
    caption: "Blink the dates, like volunteers do"
    wait: 700
    hold: 700
  - click: ".interruptor-ciencia"
    caption: "One switch opens the full science tools"
    wait: 6000
    hold: 1200
    zoom: false
  - zoom: ".aladin-container"
    caption: "Its path on the sky: 2MASS 1998 → WISE 2010 → SPHEREx 2025"
    hold: 2400
  - click: ".dupla-mapa button:has-text('2MASS')"
    zoom: false
    wait: 3500
    hold: 150
  - zoom: ".aladin-container"
    caption: "Same spot in 1998 (2MASS): too cold to show up"
    hold: 1300
  - click: ".dupla-mapa button:has-text('AllWISE')"
    zoom: false
    wait: 3500
    hold: 150
  - zoom: ".aladin-container"
    caption: "2010 (WISE, 4.6 µm): there it is"
    hold: 1300
  - click: ".dupla-mapa button:has-text('SPHEREx 2025')"
    zoom: false
    wait: 3000
    hold: 150
  - zoom: ".aladin-container"
    caption: "2025–26 (SPHEREx): it keeps moving"
    hold: 1400
  - zoom: ".exp-escena canvas"
    caption: "Median of 10 exposures, last visit minus first: blue = where it was, red = where it is"
    hold: 3200
  - scroll: ".huella"
    caption: "Its spectrum from SPHEREx's 102 colors"
    hold: 1800
  - zoom: ".ficha"
    caption: "Clean measurements only at 3.8–4.8 µm, where WISE 0855 gives off almost all its light"
    hold: 3000
  - view: full
    caption: "Real NASA data, in any browser, free"
    hold: 2000
