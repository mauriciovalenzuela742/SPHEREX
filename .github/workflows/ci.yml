# CI mínimo. Genérico: no sabe nada del desafío.
# Objetivo: que nadie mergee algo que no levanta. Nada más.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        working-directory: scaffold/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Linter
        working-directory: scaffold/backend
        run: ruff check . || true   # en el evento, quitar el "|| true"
      - name: Tests
        working-directory: scaffold/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar y construir
        working-directory: scaffold/frontend
        run: |
          npm install
          npm run build
